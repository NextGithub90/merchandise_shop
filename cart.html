  <script src="js/product-data.js"></script>
  <script src="js/main.js"></script>
  <script>
  (function() {
    var cartMain = document.getElementById('cartMain');

    function renderCart() {
      var cart = WotakuCart.getCart();
      if (cart.length === 0) {
        cartMain.innerHTML =
          '<div style="grid-column:1/-1">' +
          '<div class="cart-empty">' +
            '<div class="cart-empty-icon">🛒</div>' +
            '<h2 class="cart-empty-title">Keranjang Masih Kosong</h2>' +
            '<p class="cart-empty-text">Temukan produk favoritmu dan tambahkan ke keranjang.</p>' +
            '<a href="shop.html" class="cart-shop-btn">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>' +
              'Mulai Belanja' +
            '</a>' +
          '</div></div>';
        return;
      }

      var itemsHTML = '';
      cart.forEach(function(item) {
        var subtotal = item.price * (item.quantity || 1);
        itemsHTML +=
          '<div class="cart-item" data-id="' + item.id + '">' +
            '<div class="cart-item-product">' +
              '<img class="cart-item-img" src="' + (item.image || 'assets/images/prod_figure.webp') + '" alt="' + item.name + '" onerror="this.src=\'assets/images/prod_figure.webp\'" />' +
              '<div class="cart-item-info">' +
                '<p class="cart-item-brand">' + (item.brand || '') + '</p>' +
                '<p class="cart-item-name">' + item.name + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="cart-item-price">' + WotakuCart.fmt(item.price) + '</div>' +
            '<div class="cart-qty">' +
              '<button class="cart-qty-btn qty-minus" data-id="' + item.id + '">&#8722;</button>' +
              '<input class="cart-qty-input" type="number" value="' + (item.quantity || 1) + '" min="1" max="99" data-id="' + item.id + '" />' +
              '<button class="cart-qty-btn qty-plus" data-id="' + item.id + '">&#43;</button>' +
            '</div>' +
            '<div class="cart-item-subtotal">' + WotakuCart.fmt(subtotal) + '</div>' +
            '<button class="cart-remove-btn" data-id="' + item.id + '" aria-label="Hapus produk">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
            '</button>' +
          '</div>';
      });

      var total = WotakuCart.getTotal();
      var count = WotakuCart.getCount();

      cartMain.innerHTML =
        '<div>' +
          '<h1 class="cart-section-title">Keranjang Belanja</h1>' +
          '<p class="cart-section-subtitle">' + count + ' produk dalam keranjang</p>' +
          '<div class="cart-items-card">' +
            '<div class="cart-table-head">' +
              '<div class="cart-th">Produk</div>' +
              '<div class="cart-th">Harga</div>' +
              '<div class="cart-th">Jumlah</div>' +
              '<div class="cart-th">Subtotal</div>' +
              '<div class="cart-th"></div>' +
            '</div>' +
            itemsHTML +
            '<div class="cart-bottom">' +
              '<a href="shop.html" class="cart-continue-link">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="19 12 5 12"/><polyline points="12 5 5 12 12 19"/></svg>' +
                'Lanjutkan Belanja' +
              '</a>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="cart-summary-card">' +
            '<div class="cart-summary-header">' +
              '<div class="cart-summary-title">Total Keranjang</div>' +
            '</div>' +
            '<div class="cart-summary-body">' +
              '<div class="cart-summary-row"><span class="cart-summary-label">Subtotal</span><span class="cart-summary-value" id="summarySubtotal">' + WotakuCart.fmt(total) + '</span></div>' +
              '<div class="cart-summary-row"><span class="cart-summary-label">Ongkos Kirim</span><span class="cart-shipping-note">Dihitung saat checkout</span></div>' +
              '<div class="cart-summary-row"><span class="cart-summary-total-label">Total</span><span class="cart-summary-total-value" id="summaryTotal">' + WotakuCart.fmt(total) + '</span></div>' +
              '<button class="cart-checkout-btn" id="checkoutBtn">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' +
                'Lanjutkan ke Checkout' +
              '</button>' +
              '<div class="cart-trust-mini">' +
                '<div class="cart-trust-mini-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>Produk 100% Asli & Original</div>' +
                '<div class="cart-trust-mini-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>Pengiriman Cepat & Terjamin</div>' +
                '<div class="cart-trust-mini-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>Garansi Retur 7 Hari</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      // Bind events
      cartMain.querySelectorAll('.cart-remove-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          WotakuCart.removeItem(btn.dataset.id);
          renderCart();
        });
      });
      cartMain.querySelectorAll('.qty-minus').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var cart = WotakuCart.getCart();
          var item = cart.find(function(c){return c.id===btn.dataset.id;});
          if (item && item.quantity > 1) { WotakuCart.updateQty(btn.dataset.id, item.quantity - 1); renderCart(); }
          else if (item && item.quantity <= 1) { WotakuCart.removeItem(btn.dataset.id); renderCart(); }
        });
      });
      cartMain.querySelectorAll('.qty-plus').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var cart = WotakuCart.getCart();
          var item = cart.find(function(c){return c.id===btn.dataset.id;});
          if (item) { WotakuCart.updateQty(btn.dataset.id, (item.quantity||1) + 1); renderCart(); }
        });
      });
      cartMain.querySelectorAll('.cart-qty-input').forEach(function(input) {
        input.addEventListener('change', function() {
          var qty = parseInt(input.value, 10);
          if (qty >= 1) { WotakuCart.updateQty(input.dataset.id, qty); renderCart(); }
        });
      });
      var checkoutBtn = document.getElementById('checkoutBtn');
      if (checkoutBtn) {
        checkoutBtn.addEventListener('click', function() { window.location.href = 'checkout.html'; });
      }
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  })();
  </script>
